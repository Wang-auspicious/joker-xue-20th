<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>薛之谦评论文化河流图</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600;700;900&display=swap');
    :root{--paper:#F4EFE6;--ink:#2E261F;--serif:'Noto Serif SC','Source Han Serif SC',serif;--latin:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',ui-monospace,monospace}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper)}
    body{display:grid;place-items:center;color:var(--ink)}
    svg{width:100vw;height:100vh;display:block;background:#F4EFE6}
    text{font-family:var(--serif)}
    .title{font-size:50px;font-weight:900;letter-spacing:2px;fill:#2E261F}.en{font:700 14px var(--latin);letter-spacing:1.45px;text-transform:uppercase;fill:#625346}
    .sub{font-size:25px;font-weight:700;fill:#4A3B31}.small{font:400 10px var(--mono);fill:#7A6D62}
    .grid{stroke:rgba(90,75,60,.06);stroke-width:1}.year-line{stroke:rgba(90,75,60,.11);stroke-width:1;stroke-dasharray:2 6}
    .river-layer{cursor:pointer;transition:opacity .18s ease}.river-layer.mute .river-area,.river-layer.mute .river-edge,.river-layer.mute .river-hatch{opacity:.18!important}.river-layer.hot .river-area{opacity:.91!important}
    .river-area{mix-blend-mode:multiply}.river-edge{fill:none;pointer-events:none}.river-hatch{pointer-events:none;mix-blend-mode:multiply}
    .river-name{font-size:12px;font-weight:800;letter-spacing:.25px;fill:rgba(50,40,34,.76)}
    .guide{stroke:rgba(70,55,45,.36);stroke-width:1;stroke-dasharray:3 4;fill:none}.guide.soft{stroke:rgba(70,55,45,.2)}
    .node{transition:opacity .18s ease,filter .18s ease}.node.mute{opacity:.15}.node.hot{filter:drop-shadow(0 2px 3px rgba(75,55,40,.18))}
    .node-title{font-size:13px;font-weight:800;fill:#382E27}.node-sub{font-size:10px;fill:#6E6258}.node-data{font-size:10px;font-weight:800;fill:#9B3F37}
    .pill-t{font-size:12px;font-weight:900;fill:#FAF0E5}.pill-s{font:500 10px var(--mono);fill:#F2E4D6}.tiny{font-size:9px;fill:#75695F}
    .axis{stroke:#8D7565;stroke-width:1.25}.axis-early{stroke:rgba(141,117,101,.35);stroke-width:1.25;stroke-dasharray:6 6}
    .year{font:600 12px var(--latin);fill:#5F5147}.axis-note{font-size:12px;font-weight:800;fill:#6D5B50}.axis-sub{font:400 11px var(--mono);fill:#8C7D70}
    .note-title{font-size:15px;font-weight:900;fill:#3C3027}.note-body{font-size:12px;fill:#6C6258}
    .legend-cn{font-size:11px;font-weight:800;fill:#3D332C}.legend-en{font:600 8px var(--latin);letter-spacing:.55px;fill:#776B61}
    .source{font:400 9px var(--mono);fill:#8E8378}.tip{position:fixed;z-index:20;width:266px;padding:10px 12px;border:1px solid rgba(74,59,49,.32);background:rgba(250,246,238,.97);box-shadow:0 8px 20px rgba(55,40,28,.1);font:12px/1.55 var(--serif);color:#3B3028;pointer-events:none;opacity:0;transform:translate(12px,12px)}
    .tip b{display:block;font-size:14px;margin-bottom:2px}.tip .meta{font:700 10px var(--mono);color:#8B493D;margin-bottom:3px}
  </style>
</head>
<body>
<div id="tip" class="tip"></div>
<svg id="river" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="薛之谦评论文化河流图"></svg>
<script>
(() => {
  const svg=d3.select("#river"),tip=d3.select("#tip");
  const W=1920,H=1080,x=y=>90+(y-2006)/20*1720,fmt=n=>n>=1e4?(n/1e4).toFixed(n>=1e6?1:0)+"万":String(n),dark=c=>d3.color(c).darker(.75).formatHex();
  const yr=[
    [2013,114,.0789,.3205,.0241,23.4],[2014,1311,.0625,.2949,.0423,20.5],[2015,77187,.0617,.3679,.0679,30.8],
    [2016,919320,.0651,.4137,.0812,38.7],[2017,1874253,.0618,.4831,.1027,48.6],[2018,1053659,.0675,.4925,.1035,48.7],
    [2019,1431460,.1087,.4532,.1045,40.3],[2020,1845852,.0829,.4372,.0935,38.4],[2021,782993,.1268,.4296,.1003,37.4],
    [2022,779940,.1134,.4376,.0977,38.0],[2023,654208,.1147,.4063,.1007,37.2],[2024,499609,.1313,.4067,.0944,37.4],
    [2025,778412,.1157,.3317,.0644,30.4],[2026,227078,.1809,.3457,.0696,32.9]
  ].map(d=>({year:d[0],n:d[1],low:d[2],subj:d[3],ctx:d[4],len:d[5]}));
  const albums=[
    ["未完成的歌",2006.44,"2006-06-09",315506,.1398,.0592,.0191,"早期源头"],["意外",2013.86,"2013-11-11",1123502,.1686,.0687,.0373,"主观性 .500"],
    ["初学者",2016.43,"2016-06-07",857755,.1838,.0906,.0279,"评论洪峰前夜"],["渡",2017.84,"2017-11-03",1842233,.2235,.1357,.0259,"184.2万评论"],
    ["怪咖",2018.36,"2018-05-10",1227384,.2028,.1089,.0307,"均长47.4字"],["尘",2019.49,"2019-06-26",1289563,.2960,.2057,.0199,"语境 .106"],
    ["天外来物",2020.54,"2020-07-17",1545967,.2342,.1549,.0197,"154.6万评论"],["无数",2021.54,"2021-07-17",630473,.4277,.3379,.0151,"身份认同"],
    ["守村人",2023.46,"2023-06-16",698913,.4613,.3706,.0121,"深夜46.13%"],["跃",2025.54,"2025-07-17",778412,.365,.22,.012,"身份认同"]
  ].map((d,i)=>({name:d[0],y:d[1],date:d[2],comments:d[3],night:d[4],zero:d[5],long:d[6],tag:d[7],color:["#9B7B56","#B0584F","#B6793D","#93493F","#A06357","#9B5A4B","#B67D45","#7A6D8F","#6B8A68","#B07A3C"][i]}));
  const defs=svg.append("defs");
  const noise=defs.append("filter").attr("id","paperNoise").attr("x",0).attr("y",0).attr("width","100%").attr("height","100%");
  noise.append("feTurbulence").attr("type","fractalNoise").attr("baseFrequency",".85").attr("numOctaves",3).attr("seed",17);noise.append("feColorMatrix").attr("type","saturate").attr("values",0);
  const coverGrad=defs.append("linearGradient").attr("id","coverPaper").attr("x1",0).attr("y1",0).attr("x2",1).attr("y2",1);
  coverGrad.append("stop").attr("offset","0%").attr("stop-color","#E8DED2");coverGrad.append("stop").attr("offset","55%").attr("stop-color","#CBBBAA");coverGrad.append("stop").attr("offset","100%").attr("stop-color","#F6EFE5");
  svg.append("rect").attr("width",W).attr("height",H).attr("fill","#F4EFE6");svg.append("rect").attr("width",W).attr("height",H).attr("filter","url(#paperNoise)").attr("opacity",.035);
  d3.range(0,H+1,40).forEach(y=>svg.append("line").attr("class","grid").attr("x1",0).attr("x2",W).attr("y1",y).attr("y2",y));
  d3.range(2006,2027,2).forEach(y=>svg.append("line").attr("class","year-line").attr("x1",x(y)).attr("x2",x(y)).attr("y1",190).attr("y2",920));
  svg.append("path").attr("d","M80,380 C180,338 300,372 420,322 C560,354 705,276 858,312 C1010,260 1150,286 1300,238 C1440,292 1575,254 1700,318 C1760,338 1810,318 1840,294 L1840,466 C1560,420 1370,455 1110,428 C820,392 548,444 80,408 Z").attr("fill","#EFC6C2").attr("opacity",.20);
  svg.append("path").attr("d","M82,642 C235,610 398,660 552,621 C720,677 884,636 1040,682 C1225,622 1400,672 1585,625 C1700,606 1788,642 1840,646 L1840,790 C1520,770 1280,820 1010,778 C735,742 430,806 80,760 Z").attr("fill","#C6CEC0").attr("opacity",.25);

  const mast=svg.append("g");
  mast.append("text").attr("x",70).attr("y",73).attr("class","title").text("薛之谦评论文化河流图");
  mast.append("text").attr("x",72).attr("y",105).attr("class","en").text("Comment Culture River Map");
  mast.append("text").attr("x",72).attr("y",148).attr("class","sub").text("从听歌反馈，到五维评论文化的沉积");
  mast.append("path").attr("d","M74,171 C105,162 136,179 168,169 C199,160 222,170 252,166").attr("fill","none").attr("stroke","#B88D78").attr("stroke-width",4).attr("opacity",.55);
  mast.append("text").attr("x",72).attr("y",190).attr("class","small").text("v3 secondary cleaning · 10,925,396 comments · 2013—2026 comment data");
  const note=svg.append("g").attr("transform","translate(1390,70)");
  note.append("text").attr("class","note-title").text("这张图怎么看");
  ["外轮廓是评论总量形成的文化水位；内部色层","不是并列河道，而是同一条评论大河中的沉积。","颜色越厚，表示该时期对应的语义机制越强：","叙事、记忆、仪式、深夜长评与身份认同互相覆盖。"].forEach((t,i)=>note.append("text").attr("class","note-body").attr("x",0).attr("y",30+i*22).text(t));

  const domains=yr.map(d=>d.year),v=(key,t)=> t<2013?0:d3.scaleLinear().domain(domains).range(yr.map(d=>d[key])).clamp(true)(t);
  const gauss=(t,c,w)=>Math.exp(-Math.pow(t-c,2)/(2*w*w)),clamp=(a,b,c)=>Math.max(b,Math.min(c,a));
  const nMax=d3.max(yr,d=>d.n),lowMax=d3.max(yr,d=>d.n*d.low);
  const tail=t=>t>2025.25?clamp(1-.55*((t-2025.25)/.75),.36,1):1;
  const mouth=t=>d3.scaleLinear().domain([2006,2013,2017,2024,2026]).range([.16,.36,1,1,.42]).clamp(true)(t);
  const volume=t=> t<2013 ? (.035+albums.slice(0,1).reduce((s,a)=>s+.03*gauss(t,a.y,.9),0)) : Math.sqrt(v("n",t)/nMax)*tail(t);
  const offs=d3.scaleLinear().domain([2006,2008,2010,2012,2014,2016,2018,2020,2022,2024,2026]).range([-18,4,-12,10,-5,16,-8,12,-14,8,-10]).clamp(true);
  const spine=t=>520+offs(t);
  const years=d3.range(2006,2026.001,.2);
  function layerStrength(id,t){
    const vol=volume(t),subj=clamp((v("subj",t)-.29)/(.50-.29),0,1),ctx=clamp((v("ctx",t)-.024)/(.108-.024),0,1);
    const low=t<2013?0:Math.sqrt((v("n",t)*v("low",t))/lowMax)*tail(t);
    if(id==="flood")return vol;
    if(id==="narrative")return vol*(.30+.98*subj);
    if(id==="memory")return vol*(.28+.92*ctx);
    if(id==="ritual")return Math.min(1.25,low+.22*gauss(t,2019.55,.45)+.22*gauss(t,2020.55,.45)+.25*gauss(t,2021.55,.5)+.32*gauss(t,2023.55,.55));
    if(id==="night")return Math.min(1.18,vol*.34+.65*gauss(t,2019.5,.7)+.82*gauss(t,2021.55,.75)+1.02*gauss(t,2023.45,.75));
    if(id==="identity")return Math.min(1.15,vol*(.26+.48*gauss(t,2017.4,.9)+.72*gauss(t,2021.55,.85)+.58*gauss(t,2025.55,.7)));
  }
  const layerDefs=[
    {id:"flood",cn:"评论规模",en:"Comment volume",c:"#E5A3A0",min:8,max:265,offset:t=>0,op:.48,hatch:false},
    {id:"memory",cn:"记忆语境",en:"Memory context",c:"#5B9AB5",min:4,max:112,offset:t=>82+d3.scaleLinear().domain([2006,2012,2017,2021,2026]).range([8,-4,12,-10,4]).clamp(true)(t),op:.64,hatch:true},
    {id:"night",cn:"深夜长评",en:"Night long-form",c:"#7E75A9",min:4,max:104,offset:t=>132+d3.scaleLinear().domain([2006,2014,2019,2023,2026]).range([-2,8,-10,10,-6]).clamp(true)(t),op:.62,hatch:true},
    {id:"identity",cn:"身份认同",en:"Identity resonance",c:"#6D9B72",min:4,max:88,offset:t=>36+d3.scaleLinear().domain([2006,2016,2020,2026]).range([7,-8,10,-5]).clamp(true)(t),op:.58,hatch:false},
    {id:"narrative",cn:"主观叙事",en:"Subjective narrative",c:"#C86E5A",min:6,max:124,offset:t=>-28+d3.scaleLinear().domain([2006,2015,2018,2022,2026]).range([-6,8,-10,8,-4]).clamp(true)(t),op:.72,hatch:true},
    {id:"ritual",cn:"仪式打卡",en:"Ritual check-in",c:"#E6A33A",min:4,max:86,offset:t=>-112+d3.scaleLinear().domain([2006,2016,2020,2024,2026]).range([6,-4,9,-8,4]).clamp(true)(t),op:.72,hatch:false}
  ];
  const flows=svg.append("g").attr("id","overlapped-river"),guides=svg.append("g"),nodes=svg.append("g"),byId=new Map(layerDefs.map(d=>[d.id,d]));
  function midAt(id,t){const l=byId.get(id);return spine(t)+l.offset(t)}
  layerDefs.forEach(l=>{
    const pat=defs.append("pattern").attr("id","hatch-"+l.id).attr("patternUnits","userSpaceOnUse").attr("width",10).attr("height",10).attr("patternTransform","rotate(28)");
    pat.append("line").attr("x1",0).attr("y1",0).attr("x2",0).attr("y2",10).attr("stroke",dark(l.c)).attr("stroke-width",1).attr("opacity",.18);
    const vals=years.map(t=>layerStrength(l.id,t)),scale=d3.scaleLinear().domain(d3.extent(vals)).range([l.min,l.max]);
    l.points=years.map(t=>{const h=scale(layerStrength(l.id,t))*mouth(t),m=midAt(l.id,t);return{year:t,x:x(t),mid:m,y0:m-h/2,y1:m+h/2,h}});
    const area=d3.area().x(d=>d.x).y0(d=>d.y0).y1(d=>d.y1).curve(d3.curveBasis),line=d3.line().x(d=>d.x).curve(d3.curveBasis);
    const g=flows.append("g").attr("class","river-layer").datum(l);
    g.append("path").attr("class","river-area").attr("d",area(l.points)).attr("fill",l.c).attr("opacity",l.op);
    if(l.hatch)g.append("path").attr("class","river-hatch").attr("d",area(l.points)).attr("fill","url(#hatch-"+l.id+")").attr("opacity",.35);
    g.append("path").attr("class","river-edge").attr("d",line.y(d=>d.y0)(l.points)).attr("stroke",dark(l.c)).attr("stroke-width",1.15).attr("opacity",.62);
    g.append("path").attr("class","river-edge").attr("d",line.y(d=>d.y1)(l.points)).attr("stroke",dark(l.c)).attr("stroke-width",1.15).attr("opacity",.62);
    g.append("text").attr("class","river-name").attr("x",112).attr("y",midAt(l.id,2006)-l.max/2-8).text(l.cn+" / "+l.en);
    g.on("mouseenter",()=>hot(l.id)).on("mouseleave",()=>{if(!locked)clear()});
  });
  let locked=null;svg.on("click",()=>{locked=null;clear()});
  function hot(id){d3.selectAll(".river-layer").classed("mute",d=>d.id!==id).classed("hot",d=>d.id===id);d3.selectAll(".node").classed("mute",function(){return d3.select(this).datum()?.flow!==id}).classed("hot",function(){return d3.select(this).datum()?.flow===id})}
  function clear(){d3.selectAll(".river-layer,.node").classed("mute",false).classed("hot",false);tip.style("opacity",0)}
  function guide(x1,y1,x2,y2,soft=false){guides.append("line").attr("class",soft?"guide soft":"guide").attr("x1",x1).attr("y1",y1).attr("x2",x2).attr("y2",y2)}
  function dot(cx,cy,c){guides.append("circle").attr("cx",cx).attr("cy",cy).attr("r",3.7).attr("fill",c).attr("stroke","#F7EFE4").attr("stroke-width",1.2)}
  function bind(g,d){g.datum(d).attr("class","node").style("cursor","pointer").on("mouseenter",(e,v)=>{hot(v.flow);show(e,v)}).on("mousemove",show).on("mouseleave",()=>{if(!locked){tip.style("opacity",0);clear()}}).on("click",(e,v)=>{e.stopPropagation();locked=locked===v.id?null:v.id;if(!locked){clear();return}hot(v.flow);show(e,v)})}
  function show(e,d){tip.html(`<b>${d.title}</b><div class="meta">${d.meta||""}</div><div>${d.data||""}</div><div style="margin-top:4px;color:#67584d">${d.note||""}</div>`).style("opacity",1).style("left",e.clientX+"px").style("top",e.clientY+"px")}
  function cover(g,a,s=52){g.append("rect").attr("width",s).attr("height",s).attr("fill","url(#coverPaper)").attr("stroke","#8A7667").attr("stroke-width",.9);g.append("rect").attr("x",5).attr("y",5).attr("width",s-10).attr("height",s-10).attr("fill",a.color).attr("opacity",.22);g.append("path").attr("d",`M6,${s-9} C${s*.28},${s*.56} ${s*.52},${s*.75} ${s-6},10`).attr("stroke",a.color).attr("stroke-width",2.2).attr("fill","none").attr("opacity",.55);g.append("circle").attr("cx",s*.68).attr("cy",s*.35).attr("r",s*.16).attr("fill","none").attr("stroke",a.color).attr("stroke-width",1.2);g.append("text").attr("x",s/2).attr("y",s/2+5).attr("text-anchor","middle").attr("font-size",18).attr("font-weight",900).attr("fill","#3A3028").text(a.name.slice(0,2))}
  const albumLayout=[["意外",170,"narrative"],["渡",135,"flood"],["尘",184,"memory"],["无数",218,"identity"],["跃",178,"identity"],["初学者",812,"flood"],["怪咖",842,"narrative"],["天外来物",794,"flood"],["守村人",824,"night"]];
  albumLayout.forEach(([name,ny,flow])=>{const a=albums.find(d=>d.name===name),cx=x(a.y),cy=midAt(flow,a.y),top=ny<500,g=nodes.append("g").attr("transform",`translate(${cx-26},${ny})`);guide(cx,top?ny+56:ny,cx,cy);guide(cx,cy,cx,920,true);dot(cx,cy,byId.get(flow).c);bind(g,{id:"album-"+name,flow,title:"《"+name+"》",meta:a.date,data:`${fmt(a.comments)}评论 · ${a.tag}`,note:"专辑节点解释文化水位在这一年为什么突然变宽、转向或形成新的沉积层。"});cover(g,a);g.append("text").attr("class","node-title").attr("x",62).attr("y",13).text("《"+name+"》");g.append("text").attr("class","node-sub").attr("x",62).attr("y",31).text(a.date.slice(0,4)+" AD · 专辑节点");g.append("text").attr("class","node-data").attr("x",62).attr("y",48).text(a.tag)});
  function pill(d){const s=byId.get(d.flow),cx=x(d.year),cy=midAt(d.flow,d.year),px=d.x??cx,py=d.y,w=d.w||150;guide(px+w/2,py+(d.top?42:0),cx,cy);if(d.axis)guide(cx,cy,cx,920,true);dot(cx,cy,s.c);const g=nodes.append("g").attr("transform",`translate(${px},${py})`);bind(g,d);g.append("rect").attr("width",w).attr("height",42).attr("rx",18).attr("fill",d.fill||dark(s.c)).attr("opacity",.92);g.append("circle").attr("cx",13).attr("cy",21).attr("r",4).attr("fill","#F8EDE2");g.append("text").attr("class","pill-t").attr("x",25).attr("y",18).text(d.title);g.append("text").attr("class","pill-s").attr("x",25).attr("y",34).text(d.short)}
  pill({id:"vol-peak",flow:"flood",year:2017.3,x:x(2017.3)-82,y:312,w:178,top:true,axis:true,title:"评论洪峰",short:"2017 / 2020 双峰",meta:"full_cleaning_by_year.csv",data:"2017:187.4万；2020:184.6万",note:"外轮廓在中段膨胀，说明评论文化不是匀速增长，而是由专辑与平台事件共同推高。"});
  pill({id:"subjective-peak",flow:"narrative",year:2018.1,x:x(2018.1)-120,y:398,w:188,top:true,title:"主观叙事峰",short:"2017—2018 均长≈48字",meta:"year_trends.csv",data:"主观性 .483 / .492；平均长度 48.6 / 48.7",note:"这一层对应从短反馈转向故事、评价和自我表述的高峰。"});
  pill({id:"context-memory",flow:"memory",year:2019.4,x:x(2019.4)-78,y:686,w:178,title:"记忆语境层",short:"context ≈ .104—.107",meta:"year_trends.csv",data:"2019、2021、2023 语境复杂度维持高位",note:"评论开始携带人物、时间、地点、关系，像把个人档案写进歌下面。"});
